$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Grid
group: Cats - Layout
status: stable
description: "Sistema de grid flexible con 12 columnas y multiples configuraciones."
props:
  type: object
  properties:
    columns:
      type: string
      title: Columnas (Desktop)
      description: "Numero de columnas en pantallas grandes"
      enum:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
        - "12"
      meta:enum:
        "1": "1 Columna"
        "2": "2 Columnas"
        "3": "3 Columnas"
        "4": "4 Columnas"
        "5": "5 Columnas"
        "6": "6 Columnas"
        "12": "12 Columnas"
      examples:
        - "3"
      default: "3"
    columns_tablet:
      type: string
      title: Columnas (Tablet)
      description: "Numero de columnas en tablets"
      enum:
        - "1"
        - "2"
        - "3"
        - "4"
      meta:enum:
        "1": "1 Columna"
        "2": "2 Columnas"
        "3": "3 Columnas"
        "4": "4 Columnas"
      examples:
        - "2"
      default: "2"
    columns_mobile:
      type: string
      title: Columnas (Movil)
      description: "Numero de columnas en moviles"
      enum:
        - "1"
        - "2"
      meta:enum:
        "1": "1 Columna"
        "2": "2 Columnas"
      examples:
        - "1"
      default: "1"
    gap:
      type: string
      title: Espaciado entre elementos
      enum:
        - none
        - sm
        - md
        - lg
        - xl
      meta:enum:
        none: "Sin espaciado"
        sm: "Pequeno"
        md: "Mediano"
        lg: "Grande"
        xl: "Extra grande"
      examples:
        - md
      default: md
    align_items:
      type: string
      title: Alineacion vertical
      enum:
        - start
        - center
        - end
        - stretch
      meta:enum:
        start: Arriba
        center: Centro
        end: Abajo
        stretch: Estirar
      examples:
        - stretch
      default: stretch
    justify_content:
      type: string
      title: Alineacion horizontal
      enum:
        - start
        - center
        - end
        - between
        - around
        - evenly
      meta:enum:
        start: Inicio
        center: Centro
        end: Final
        between: "Espacio entre"
        around: "Espacio alrededor"
        evenly: "Espacio uniforme"
      examples:
        - start
      default: start
    css_class:
      type: string
      title: Clases CSS adicionales
      default: ""
    html_id:
      type: string
      title: ID HTML
      default: ""

slots:
  items:
    title: "Elementos del grid"
