$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: CTA
group: 'Cats - Marketing'
status: stable
description: 'Llamada a la accion con titulo, descripcion y botones.'
props:
  type: object
  required:
    - heading
    - style
  properties:
    heading:
      type: string
      title: Titulo
      default: 'Listo para empezar?'
      examples:
        - 'Listo para empezar?'
    description:
      type: string
      title: Descripcion
      default: ''
    style:
      type: string
      title: Estilo
      enum:
        - default
        - primary
        - dark
        - gradient
      default: primary
      examples:
        - primary
    alignment:
      type: string
      title: Alineacion
      enum:
        - left
        - center
      default: center
    size:
      type: string
      title: Tamano
      enum:
        - sm
        - md
        - lg
      default: md
    rounded:
      type: boolean
      title: 'Bordes redondeados'
      default: true
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  buttons:
    title: 'Botones de accion'
  background:
    title: 'Imagen de fondo'
