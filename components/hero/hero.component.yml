$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Hero
group: Cats - Layout
status: stable
description: "Hero con imagen de fondo y contenido flexible."
props:
  type: object
  properties:
    background_image:
      $ref: json-schema-definitions://canvas.module/image
      title: Imagen de fondo
    height:
      type: string
      title: Altura
      enum:
        - auto
        - sm
        - md
        - lg
        - xl
        - full
      default: "lg"
    content_align_horizontal:
      type: string
      title: Alineacion horizontal
      enum:
        - left
        - center
        - right
      default: "center"
    content_align_vertical:
      type: string
      title: Alineacion vertical
      enum:
        - top
        - center
        - bottom
      default: "center"
    overlay:
      type: string
      title: Overlay oscuro
      enum:
        - none
        - light
        - md
        - dark
      default: "md"
    background_position:
      type: string
      title: Posicion de imagen
      enum:
        - center
        - top
        - bottom
      default: "center"
    css_class:
      type: string
      title: Clases CSS adicionales
      default: ""
    html_id:
      type: string
      title: ID HTML
      default: ""

slots:
  content:
    title: "Contenido"
