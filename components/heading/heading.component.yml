$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Heading
group: 'Cats - Content'
status: stable
description: 'Título con opciones de tamaño, color y alineación.'
props:
  type: object
  required:
    - heading_text
    - level
    - text_size
    - text_color
    - align
  properties:
    heading_text:
      type: string
      title: 'Texto del título'
      default: 'Tu título aquí'
      examples:
        - 'Tu título aquí'
    level:
      type: number
      title: 'Nivel de título'
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      default: 2
      examples:
        - 2
    text_size:
      type: string
      title: Tamaño
      enum:
        - sm
        - base
        - lg
        - xl
        - 2xl
        - 3xl
        - 4xl
        - 5xl
      default: 3xl
      examples:
        - 3xl
    text_color:
      type: string
      title: Color
      enum:
        - default
        - primary
        - secondary
        - accent
        - muted
        - white
      default: default
      examples:
        - default
    align:
      type: string
      title: Alineación
      enum:
        - left
        - center
        - right
      default: left
      examples:
        - left
    font_weight:
      type: string
      title: 'Peso de fuente'
      enum:
        - normal
        - medium
        - semibold
        - bold
        - extrabold
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
