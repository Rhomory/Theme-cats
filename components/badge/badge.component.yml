$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Badge
group: 'Cats - Content'
status: stable
description: 'Etiqueta o insignia para destacar estados o categorias.'
props:
  type: object
  required:
    - text
    - variant
  properties:
    text:
      type: string
      title: Texto
      default: Nuevo
      examples:
        - Nuevo
    variant:
      type: string
      title: Variante
      enum:
        - primary
        - secondary
        - success
        - warning
        - error
        - info
        - neutral
      default: primary
      examples:
        - primary
    size:
      type: string
      title: Tamano
      enum:
        - sm
        - md
        - lg
      default: md
    style:
      type: string
      title: Estilo
      enum:
        - solid
        - soft
        - outline
      default: solid
    rounded:
      type: string
      title: Bordes
      enum:
        - default
        - full
      default: full
    icon:
      type: string
      title: Icono
      enum:
        - none
        - check
        - x
        - star
        - clock
        - alert
      default: none
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
