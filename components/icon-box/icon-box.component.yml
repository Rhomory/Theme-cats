$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'Icon Box'
group: 'Cats - Marketing'
status: stable
description: 'Caja de iconos para destacar caracteristicas o servicios.'
props:
  type: object
  required:
    - title
    - icon
    - layout
  properties:
    icon:
      type: string
      title: Icono
      enum:
        - star
        - check
        - heart
        - shield
        - zap
        - target
        - award
        - briefcase
        - code
        - globe
        - users
        - settings
      default: star
      examples:
        - star
    title:
      type: string
      title: Titulo
      default: Titulo
      examples:
        - Titulo
    description:
      type: string
      title: Descripcion
      default: ''
    layout:
      type: string
      title: Diseno
      enum:
        - vertical
        - horizontal
      default: vertical
      examples:
        - vertical
    alignment:
      type: string
      title: Alineacion
      enum:
        - left
        - center
      default: center
    icon_size:
      type: string
      title: 'Tamano del icono'
      enum:
        - sm
        - md
        - lg
      default: md
    icon_style:
      type: string
      title: 'Estilo del icono'
      enum:
        - plain
        - circle
        - square
      default: circle
    icon_color:
      type: string
      title: 'Color del icono'
      enum:
        - primary
        - secondary
        - accent
      default: primary
    link_url:
      type: string
      title: 'URL de enlace'
      default: ''
    link_text:
      type: string
      title: 'Texto del enlace'
      default: 'Ver mas'
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  content:
    title: 'Contenido adicional'
