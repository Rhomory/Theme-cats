$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Testimonial
group: 'Cats - Marketing'
status: stable
description: 'Testimonio con imagen, nombre, cargo y cita.'
props:
  type: object
  required:
    - quote
    - author_name
    - layout
  properties:
    quote:
      type: string
      title: Cita/Testimonio
      default: 'Este es un testimonio de ejemplo.'
      examples:
        - 'Este es un testimonio de ejemplo.'
    author_name:
      type: string
      title: 'Nombre del autor'
      default: 'Juan Pérez'
      examples:
        - 'Juan Pérez'
    author_title:
      type: string
      title: Cargo
      default: ''
    author_company:
      type: string
      title: Empresa
      default: ''
    rating:
      type: number
      title: 'Calificación (estrellas)'
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
      default: 5
    layout:
      type: string
      title: Diseño
      enum:
        - card
        - minimal
        - quote
      default: card
      examples:
        - card
    alignment:
      type: string
      title: Alineación
      enum:
        - left
        - center
      default: center
    background:
      type: string
      title: 'Color de fondo'
      enum:
        - white
        - muted
        - primary
        - dark
      default: white
    shadow:
      type: string
      title: Sombra
      enum:
        - none
        - sm
        - md
        - lg
      default: md
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  author_image:
    title: 'Foto del autor'
