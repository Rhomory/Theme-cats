$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'Text Editor'
group: 'Cats - Content'
status: stable
description: 'Contenido de texto enriquecido con estilos tipograficos.'
props:
  type: object
  required:
    - prose_size
    - align
  properties:
    prose_size:
      type: string
      title: 'Tamano de prosa'
      enum:
        - sm
        - base
        - lg
        - xl
      default: base
      examples:
        - base
    align:
      type: string
      title: Alineacion
      enum:
        - left
        - center
        - right
      default: left
      examples:
        - left
    max_width:
      type: string
      title: 'Ancho maximo'
      enum:
        - none
        - prose
        - xl
        - full
      default: prose
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  content:
    title: 'Contenido del editor'
