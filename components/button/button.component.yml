$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Button
group: 'Cats - Content'
status: stable
description: 'Boton con multiples variantes y tamanos.'
props:
  type: object
  required:
    - label
    - variant
    - size
  properties:
    label:
      type: string
      title: 'Texto del boton'
      default: 'Clic aqui'
      examples:
        - 'Clic aqui'
    href:
      type: string
      title: 'URL de enlace'
      default: ''
    variant:
      type: string
      title: Variante
      enum:
        - primary
        - secondary
        - outline
        - ghost
        - link
      default: primary
      examples:
        - primary
    size:
      type: string
      title: Tamano
      enum:
        - sm
        - md
        - lg
      default: md
      examples:
        - md
    icon:
      type: string
      title: Icono
      enum:
        - none
        - arrow-right
        - arrow-left
        - download
        - external-link
        - plus
        - check
      default: none
    icon_position:
      type: string
      title: 'Posicion del icono'
      enum:
        - left
        - right
      default: right
    full_width:
      type: boolean
      title: 'Ancho completo'
      default: false
    rounded:
      type: string
      title: 'Borde redondeado'
      enum:
        - default
        - full
      default: default
    disabled:
      type: boolean
      title: Deshabilitado
      default: false
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
