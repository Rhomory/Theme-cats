$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Container
group: 'Cats - Layout'
status: stable
description: 'Contenedor flexible con opciones de ancho, fondo y espaciado.'
props:
  type: object
  required:
    - width
    - background_color
    - padding
  properties:
    width:
      type: string
      title: Ancho
      enum:
        - full
        - boxed
        - narrow
        - wide
      default: boxed
      examples:
        - boxed
    background_color:
      type: string
      title: 'Color de fondo'
      enum:
        - transparent
        - primary
        - secondary
        - accent
        - muted
        - white
        - dark
      default: transparent
      examples:
        - transparent
    padding:
      type: string
      title: 'Espaciado interno'
      enum:
        - none
        - sm
        - md
        - lg
        - xl
      default: md
      examples:
        - md
    border_radius:
      type: string
      title: 'Bordes redondeados'
      enum:
        - none
        - sm
        - md
        - lg
        - xl
        - full
      default: none
    shadow:
      type: string
      title: Sombra
      enum:
        - none
        - sm
        - md
        - lg
      default: none
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  content:
    title: Contenido
