$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Spacer
group: Cats - Layout
status: stable
description: "Espaciador vertical con altura configurable."
props:
  type: object
  properties:
    size:
      type: string
      title: Tamano
      enum:
        - "xs"
        - "sm"
        - "md"
        - "lg"
        - "xl"
        - "2xl"
        - "3xl"
      default: "md"
    css_class:
      type: string
      title: Clases CSS adicionales
      default: ""
    html_id:
      type: string
      title: ID HTML
      default: ""
