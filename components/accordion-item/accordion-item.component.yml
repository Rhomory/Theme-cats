$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'Accordion Item'
group: 'Cats - Interactive'
status: stable
description: 'Item individual del acordeón.'
props:
  type: object
  required:
    - title
  properties:
    title:
      type: string
      title: Título
      default: 'Pregunta o título'
      examples:
        - 'Pregunta o título'
    is_open:
      type: boolean
      title: 'Abierto por defecto'
      default: false
    icon_position:
      type: string
      title: 'Posición del icono'
      enum:
        - left
        - right
      default: right
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  content:
    title: 'Contenido del item'
