$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: List
group: Cats - Content
status: stable
description: "Lista con iconos o bullets personalizables."
props:
  type: object
  properties:
    style:
      type: string
      title: Estilo de lista
      enum:
        - "bullet"
        - "number"
        - "check"
        - "arrow"
        - "none"
      default: "bullet"
    icon_color:
      type: string
      title: Color del icono
      enum:
        - "default"
        - "primary"
        - "secondary"
        - "accent"
        - "success"
      default: "primary"
    spacing:
      type: string
      title: Espaciado entre items
      enum:
        - "sm"
        - "md"
        - "lg"
      default: "md"
    css_class:
      type: string
      title: Clases CSS adicionales
      default: ""
    html_id:
      type: string
      title: ID HTML
      default: ""

slots:
  items:
    title: "Items de la lista"
