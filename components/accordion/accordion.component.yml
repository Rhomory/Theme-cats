$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Accordion
group: 'Cats - Interactive'
status: stable
library: cats/accordion
description: 'Acordeón expandible para FAQ o contenido colapsable.'
props:
  type: object
  required:
    - style
  properties:
    style:
      type: string
      title: Estilo
      enum:
        - default
        - bordered
        - separated
        - minimal
      default: default
      examples:
        - default
    allow_multiple:
      type: boolean
      title: 'Permitir múltiples abiertos'
      default: false
    icon_position:
      type: string
      title: 'Posición del icono'
      enum:
        - left
        - right
      default: right
    first_open:
      type: boolean
      title: 'Primer item abierto'
      default: false
    show_border:
      type: boolean
      title: 'Mostrar borde'
      default: true
    radius:
      type: string
      title: Redondeado
      enum:
        - none
        - sm
        - md
        - lg
        - xl
        - full
      default: md
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  items:
    title: 'Items del acordeón'
