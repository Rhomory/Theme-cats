$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Video
group: Cats - Content
status: stable
library: cats/video
description: "Reproductor de video con soporte para YouTube, Vimeo y videos locales."
props:
  type: object
  properties:
    source:
      type: string
      title: Tipo de fuente
      enum:
        - "youtube"
        - "vimeo"
        - "local"
      default: "youtube"
    url:
      type: string
      title: URL del video
      description: "URL de YouTube/Vimeo o ruta del archivo local"
      default: ""

    poster:
      $ref: json-schema-definitions://canvas.module/image
      title: Imagen de portada
      type: object
    aspect_ratio:
      type: string
      title: Proporcion de aspecto
      enum:
        - "16/9"
        - "4/3"
        - "1/1"
        - "21/9"
      default: "16/9"
    autoplay:
      type: boolean
      title: Reproduccion automatica
      default: false
    muted:
      type: boolean
      title: Silenciado
      default: false
    loop:
      type: boolean
      title: Repetir
      default: false
    controls:
      type: boolean
      title: Mostrar controles
      default: true
    lazy_load:
      type: boolean
      title: Carga diferida
      description: "Muestra imagen de portada hasta que el usuario hace clic"
      default: true
    border_radius:
      type: string
      title: Borde redondeado
      enum:
        - "none"
        - "sm"
        - "md"
        - "lg"
      default: "md"
    shadow:
      type: boolean
      title: Sombra
      default: false
    css_class:
      type: string
      title: Clases CSS adicionales
      default: ""
    html_id:
      type: string
      title: ID HTML
      default: ""
