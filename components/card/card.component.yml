$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Card
group: 'Cats - Marketing'
status: stable
description: 'Tarjeta con imagen, título, descripción y botón.'
props:
  type: object
  required:
    - title
    - style
  properties:
    title:
      type: string
      title: Título
      default: 'Título de la tarjeta'
      examples:
        - 'Título de la tarjeta'
    description:
      type: string
      title: Descripción
      default: ''
    button_text:
      type: string
      title: 'Texto del botón'
      default: ''
    button_url:
      type: string
      title: 'URL del botón'
      default: '#'
    style:
      type: string
      title: Estilo
      enum:
        - default
        - bordered
        - elevated
        - minimal
      default: default
      examples:
        - default
    image_position:
      type: string
      title: 'Posición de imagen'
      enum:
        - top
        - left
        - right
        - background
      default: top
    align:
      type: string
      title: 'Alineación del contenido'
      enum:
        - left
        - center
        - right
      default: left
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  card_image:
    title: 'Imagen de la tarjeta'
  card_content:
    title: 'Contenido adicional'
