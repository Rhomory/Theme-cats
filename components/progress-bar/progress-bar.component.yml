$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Progress Bar
group: Cats - Data
status: stable
description: "Barra de progreso animada con etiqueta y porcentaje."
props:
  type: object
  properties:
    percentage:
      type: number
      title: Porcentaje
      default: 75
    label:
      type: string
      title: Etiqueta
      default: ""
      examples:
        - "HTML/CSS"
    show_percentage:
      type: boolean
      title: Mostrar porcentaje
      default: true
    color:
      type: string
      title: Color de la barra
      enum:
        - "primary"
        - "secondary"
        - "accent"
        - "success"
        - "warning"
        - "error"
      default: "primary"
    size:
      type: string
      title: Altura de la barra
      enum:
        - "thin"
        - "md"
        - "thick"
      default: "md"
    rounded:
      type: boolean
      title: Bordes redondeados
      default: true
    animated:
      type: boolean
      title: Animar al aparecer
      default: true
    striped:
      type: boolean
      title: Patron rayado
      default: false
    css_class:
      type: string
      title: Clases CSS adicionales
      default: ""
    html_id:
      type: string
      title: ID HTML
      default: ""
