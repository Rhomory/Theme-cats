$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'Social Icons'
group: 'Cats - Social'
status: stable
description: 'Iconos de redes sociales con enlaces.'
props:
  type: object
  required:
    - style
    - size
  properties:
    style:
      type: string
      title: Estilo
      enum:
        - default
        - filled
        - outlined
        - minimal
      default: default
      examples:
        - default
    size:
      type: string
      title: Tamano
      enum:
        - sm
        - md
        - lg
      default: md
      examples:
        - md
    alignment:
      type: string
      title: Alineacion
      enum:
        - left
        - center
        - right
      default: center
    gap:
      type: string
      title: Espaciado
      enum:
        - sm
        - md
        - lg
      default: md
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  icons:
    title: 'Iconos de redes sociales'
