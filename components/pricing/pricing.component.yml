$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Pricing
group: 'Cats - Marketing'
status: stable
description: 'Widget de tabla de precios con características y botón de acción.'
props:
  type: object
  required:
    - title
    - price
    - button_text
  properties:
    title:
      type: string
      title: 'Título del plan'
      default: 'Plan Básico'
      examples:
        - 'Plan Básico'
    subtitle:
      type: string
      title: Subtítulo/Descripción
      default: ''
    price:
      type: string
      title: Precio
      default: '29'
      examples:
        - '29'
    currency:
      type: string
      title: Moneda
      default: $
    period:
      type: string
      title: Período
      enum:
        - month
        - year
        - one-time
      default: month
    button_text:
      type: string
      title: 'Texto del botón'
      default: Empezar
      examples:
        - Empezar
    button_url:
      type: string
      title: 'URL del botón'
      default: '#'
    badge:
      type: string
      title: Insignia/Etiqueta
      default: ''
    featured:
      type: boolean
      title: Destacado
      default: false
    background:
      type: string
      title: 'Color de fondo'
      enum:
        - white
        - muted
        - primary
        - dark
      default: white
    shadow:
      type: string
      title: Sombra
      enum:
        - none
        - sm
        - md
        - lg
      default: lg
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  features:
    title: 'Características del plan'
