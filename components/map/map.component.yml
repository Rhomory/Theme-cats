$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Map
group: Cats - Data
status: stable
description: "Mapa embebido de Google Maps u OpenStreetMap."
props:
  type: object
  properties:
    provider:
      type: string
      title: Proveedor
      enum:
        - "google"
        - "openstreetmap"
      default: "openstreetmap"
    address:
      type: string
      title: Direccion o coordenadas
      default: ""
      examples:
        - "40.7128,-74.0060"
    zoom:
      type: number
      title: Nivel de zoom
      default: 14
    height:
      type: string
      title: Altura
      enum:
        - "sm"
        - "md"
        - "lg"
        - "xl"
      default: "md"
    border_radius:
      type: string
      title: Borde redondeado
      enum:
        - "none"
        - "sm"
        - "md"
        - "lg"
      default: "md"
    css_class:
      type: string
      title: Clases CSS adicionales
      default: ""
    html_id:
      type: string
      title: ID HTML
      default: ""
