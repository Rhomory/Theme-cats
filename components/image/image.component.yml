$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Image
group: 'Cats - Content'
status: stable
description: 'Componente de imagen con opciones de tamaño y efectos.'
props:
  type: object
  required:
    - aspect_ratio
  properties:
    media:
      $ref: 'json-schema-definitions://canvas.module/image'
      title: Imagen
      type: object
    width:
      type: string
      title: Ancho
      enum:
        - auto
        - full
        - full-viewport
      default: auto
    aspect_ratio:
      type: string
      title: Proporción
      enum:
        - auto
        - '1:1'
        - '4:3'
        - '16:9'
        - '3:2'
        - '2:1'
      default: auto
      examples:
        - auto
    rounded:
      type: string
      title: 'Borde redondeado'
      enum:
        - none
        - sm
        - md
        - lg
        - full
      default: none
    shadow:
      type: string
      title: Sombra
      enum:
        - none
        - sm
        - md
        - lg
      default: none
    hover_effect:
      type: string
      title: 'Efecto hover'
      enum:
        - none
        - zoom
        - brightness
        - grayscale
      default: none
    caption:
      type: string
      title: Leyenda
      default: ''
    link_url:
      type: string
      title: 'URL de enlace'
      default: ''
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
