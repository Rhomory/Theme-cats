$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Row
group: Cats - Layout
status: stable
description: "Fila flexible con opciones de alineacion y distribucion."
props:
  type: object
  properties:
    direction:
      type: string
      title: Direccion
      enum:
        - "row"
        - "row-reverse"
        - "column"
        - "column-reverse"
      default: "row"
    wrap:
      type: string
      title: Ajuste de linea
      enum:
        - "wrap"
        - "nowrap"
        - "wrap-reverse"
      default: "wrap"
    gap:
      type: string
      title: Espaciado
      enum:
        - "none"
        - "sm"
        - "md"
        - "lg"
        - "xl"
      default: "md"
    align_items:
      type: string
      title: Alineacion vertical
      enum:
        - "start"
        - "center"
        - "end"
        - "stretch"
        - "baseline"
      default: "stretch"
    justify_content:
      type: string
      title: Distribucion horizontal
      enum:
        - "start"
        - "center"
        - "end"
        - "between"
        - "around"
        - "evenly"
      default: "start"
    padding:
      type: string
      title: Padding
      enum:
        - "none"
        - "sm"
        - "md"
        - "lg"
      default: "none"
    background_color:
      type: string
      title: Color de fondo
      enum:
        - "transparent"
        - "primary"
        - "secondary"
        - "accent"
        - "muted"
        - "white"
        - "dark"
      default: "transparent"
    css_class:
      type: string
      title: Clases CSS adicionales
      default: ""
    html_id:
      type: string
      title: ID HTML
      default: ""

slots:
  columns:
    title: "Columnas"
