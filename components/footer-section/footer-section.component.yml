$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'Footer Section'
group: 'Cats - Layout'
status: stable
description: 'Sección de pie de página con múltiples columnas.'
props:
  type: object
  required:
    - style
    - columns
  properties:
    style:
      type: string
      title: Estilo
      enum:
        - default
        - dark
        - primary
        - gradient
      default: dark
      examples:
        - dark
    columns:
      type: string
      title: Columnas
      enum:
        - '1'
        - '2'
        - '3'
        - '4'
      default: '4'
      examples:
        - '4'
    padding:
      type: string
      title: Espaciado
      enum:
        - sm
        - md
        - lg
      default: lg
    show_copyright:
      type: boolean
      title: 'Mostrar copyright'
      default: true
    copyright_text:
      type: string
      title: 'Texto de copyright'
      default: ''
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  footer_columns:
    title: 'Columnas del footer'
  footer_bottom:
    title: 'Contenido inferior (copyright, links legales)'
