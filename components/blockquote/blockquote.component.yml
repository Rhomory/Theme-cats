$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Blockquote
group: 'Cats - Content'
status: stable
description: 'Cita destacada con autor opcional.'
props:
  type: object
  required:
    - quote
    - style
  properties:
    quote:
      type: string
      title: Cita
      default: 'Esta es una cita destacada.'
      examples:
        - 'Esta es una cita destacada.'
    author:
      type: string
      title: Autor
      default: ''
    source:
      type: string
      title: Fuente
      default: ''
    style:
      type: string
      title: Estilo
      enum:
        - default
        - large
        - bordered
        - icon
      default: default
      examples:
        - default
    alignment:
      type: string
      title: Alineación
      enum:
        - left
        - center
      default: left
    color:
      type: string
      title: 'Color de acento'
      enum:
        - primary
        - secondary
        - accent
        - neutral
      default: primary
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
