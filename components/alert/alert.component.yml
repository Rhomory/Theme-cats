$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Alert
group: 'Cats - Widgets'
status: stable
description: 'Alerta/notificación con diferentes estilos.'
props:
  type: object
  required:
    - message
    - type
    - variant
  properties:
    title:
      type: string
      title: Título
      default: ''
    message:
      type: string
      title: Mensaje
      default: 'Este es un mensaje de alerta.'
      examples:
        - 'Este es un mensaje de alerta.'
    type:
      type: string
      title: 'Tipo de alerta'
      enum:
        - info
        - success
        - warning
        - error
      default: info
      examples:
        - info
    variant:
      type: string
      title: Variante
      enum:
        - filled
        - outlined
        - soft
      default: soft
      examples:
        - soft
    dismissible:
      type: boolean
      title: 'Se puede cerrar'
      default: false
    show_icon:
      type: boolean
      title: 'Mostrar icono'
      default: true
    link_url:
      type: string
      title: 'URL de enlace'
      default: ''
    link_text:
      type: string
      title: 'Texto del enlace'
      default: 'Ver más'
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  content:
    title: 'Contenido adicional'
