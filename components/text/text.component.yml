$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Text
group: 'Cats - Content'
status: stable
description: 'Bloque de texto con opciones de tipografía.'
props:
  type: object
  required:
    - text_content
    - text_size
    - text_color
    - align
  properties:
    text_content:
      type: string
      title: 'Contenido de texto'
      default: 'Tu texto aquí'
      examples:
        - 'Tu texto aquí'
    text_size:
      type: string
      title: Tamaño
      enum:
        - sm
        - base
        - lg
        - xl
      default: base
      examples:
        - base
    text_color:
      type: string
      title: Color
      enum:
        - default
        - primary
        - secondary
        - muted
        - white
      default: default
      examples:
        - default
    align:
      type: string
      title: Alineación
      enum:
        - left
        - center
        - right
        - justify
      default: left
      examples:
        - left
    line_height:
      type: string
      title: 'Altura de línea'
      enum:
        - tight
        - normal
        - relaxed
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
