$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Tabs
group: 'Cats - Interactive'
status: stable
library: cats/tabs
description: 'Contenedor de pestañas interactivas.'
props:
  type: object
  required:
    - style
  properties:
    style:
      type: string
      title: 'Estilo de pestañas'
      enum:
        - default
        - pills
        - underline
        - boxed
      default: default
      examples:
        - default
    alignment:
      type: string
      title: Alineación
      enum:
        - left
        - center
        - right
      default: left
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  tabs_content:
    title: 'Contenido de las pestañas'
