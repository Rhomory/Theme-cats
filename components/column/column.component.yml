$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Column
group: Cats - Layout
status: stable
description: "Columna flexible con control de ancho y alineacion."
props:
  type: object
  properties:
    width:
      type: string
      title: Ancho (Desktop)
      description: "Ancho de la columna basado en 12 columnas"
      enum:
        - "auto"
        - "1/12"
        - "2/12"
        - "3/12"
        - "4/12"
        - "5/12"
        - "6/12"
        - "7/12"
        - "8/12"
        - "9/12"
        - "10/12"
        - "11/12"
        - "12/12"
      default: "auto"
    width_tablet:
      type: string
      title: Ancho (Tablet)
      enum:
        - "auto"
        - "6/12"
        - "12/12"
      default: "auto"
    width_mobile:
      type: string
      title: Ancho (Movil)
      enum:
        - "auto"
        - "12/12"
      default: "12/12"
    align_self:
      type: string
      title: Alineacion propia
      enum:
        - "auto"
        - "start"
        - "center"
        - "end"
        - "stretch"
      default: "auto"
    padding:
      type: string
      title: Padding interno
      enum:
        - "none"
        - "sm"
        - "md"
        - "lg"
      default: "none"
    background_color:
      type: string
      title: Color de fondo
      enum:
        - "transparent"
        - "primary"
        - "secondary"
        - "accent"
        - "muted"
        - "white"
        - "dark"
      default: "transparent"
    border_radius:
      type: string
      title: Borde redondeado
      enum:
        - "none"
        - "sm"
        - "md"
        - "lg"
        - "full"
      default: "none"
    css_class:
      type: string
      title: Clases CSS adicionales
      default: ""
    html_id:
      type: string
      title: ID HTML
      default: ""

slots:
  content:
    title: "Contenido de la columna"
