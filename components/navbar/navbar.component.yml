$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Navbar
group: Cats - Navigation
status: stable
props:
  type: object
  properties:
    menu_align:
      title: Menu alignment
      type: string
      enum:
        - left
        - center
        - right
      default: center
    sticky:
      title: Sticky header
      type: boolean
      default: false
    transparent:
      title: Transparent background
      type: boolean
      default: false
slots:
  logo:
    title: Site logo
  navigation:
    title: Navigation menu
  links:
    title: CTA buttons
