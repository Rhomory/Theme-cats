$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Section
group: 'Cats - Layout'
status: stable
description: 'Sección con grid, header y footer opcionales.'
props:
  type: object
  required:
    - columns
    - mobile_columns
    - width
    - margin_top
    - margin_bottom
  properties:
    width:
      type: string
      title: 'Ancho de sección'
      enum:
        - '100'
        - full-viewport
        - '90'
        - '80'
        - '75'
        - '50'
      default: '100'
      examples:
        - '100'
    columns:
      type: string
      title: 'Distribución de columnas'
      enum:
        - '100'
        - 50-50
        - 33-33-33
        - 75-25
        - 25-75
        - 67-33
        - 33-67
        - 25-25-25-25
      default: '100'
      examples:
        - '100'
    mobile_columns:
      type: string
      title: 'Columnas en móvil'
      enum:
        - '1'
        - '2'
      default: '1'
      examples:
        - '1'
    margin_top:
      type: string
      title: 'Margen superior'
      enum:
        - '0'
        - sm
        - md
        - lg
        - xl
      default: md
      examples:
        - md
    margin_bottom:
      type: string
      title: 'Margen inferior'
      enum:
        - '0'
        - sm
        - md
        - lg
        - xl
      default: md
      examples:
        - md
    padding_top:
      type: string
      title: 'Padding superior'
      enum:
        - '0'
        - sm
        - md
        - lg
      default: '0'
    padding_bottom:
      type: string
      title: 'Padding inferior'
      enum:
        - '0'
        - sm
        - md
        - lg
      default: '0'
    background_color:
      type: string
      title: 'Color de fondo'
      enum:
        - transparent
        - primary
        - secondary
        - accent
        - muted
        - white
        - dark
      default: transparent
    show_header:
      type: boolean
      title: 'Mostrar encabezado'
      default: true
    show_footer:
      type: boolean
      title: 'Mostrar pie'
      default: true
    css_class:
      type: string
      title: 'Clases CSS adicionales'
      default: ''
    html_id:
      type: string
      title: 'ID HTML'
      default: ''
slots:
  header_slot:
    title: Encabezado
  main_slot:
    title: 'Contenido principal (Grid)'
  footer_slot:
    title: 'Pie de sección'
