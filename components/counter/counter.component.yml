$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Counter
group: Cats - Data
status: stable
library: cats/counter
description: "Contador animado que se activa al hacer scroll."
props:
  type: object
  properties:
    number:
      type: number
      title: Numero final
      default: 100
    prefix:
      type: string
      title: Prefijo
      description: "Texto antes del numero (ej: $, +)"
      default: ""
    suffix:
      type: string
      title: Sufijo
      description: "Texto despues del numero (ej: %, K, M)"
      default: ""
    title:
      type: string
      title: Titulo
      default: ""
    duration:
      type: number
      title: Duracion de la animacion (ms)
      default: 2000
    size:
      type: string
      title: Tamano del numero
      enum:
        - "sm"
        - "md"
        - "lg"
        - "xl"
      default: "lg"
    color:
      type: string
      title: Color del numero
      enum:
        - "default"
        - "primary"
        - "secondary"
        - "accent"
      default: "primary"
    alignment:
      type: string
      title: Alineacion
      enum:
        - "left"
        - "center"
        - "right"
      default: "center"
    css_class:
      type: string
      title: Clases CSS adicionales
      default: ""
    html_id:
      type: string
      title: ID HTML
      default: ""
