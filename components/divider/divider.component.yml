$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Divider
group: Cats - Layout
status: stable
description: "Linea divisoria con estilos personalizables."
props:
  type: object
  properties:
    style:
      type: string
      title: Estilo de linea
      enum:
        - "solid"
        - "dashed"
        - "dotted"
        - "double"
      default: "solid"
    width:
      type: string
      title: Ancho
      enum:
        - "full"
        - "3/4"
        - "1/2"
        - "1/4"
      default: "full"
    thickness:
      type: string
      title: Grosor
      enum:
        - "thin"
        - "md"
        - "thick"
      default: "thin"
    color:
      type: string
      title: Color
      enum:
        - "default"
        - "primary"
        - "secondary"
        - "accent"
        - "muted"
      default: "default"
    alignment:
      type: string
      title: Alineacion
      enum:
        - "left"
        - "center"
        - "right"
      default: "center"
    margin:
      type: string
      title: Margen vertical
      enum:
        - "none"
        - "sm"
        - "md"
        - "lg"
      default: "md"
    css_class:
      type: string
      title: Clases CSS adicionales
      default: ""
    html_id:
      type: string
      title: ID HTML
      default: ""
